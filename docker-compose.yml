services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: valida_cadastro
      POSTGRES_USER: valida
      POSTGRES_PASSWORD: ${DB_PASSWORD:-valida_dev}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valida -d valida_cadastro"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=valida_cadastro;Username=valida;Password=${DB_PASSWORD:-valida_dev}
    ports:
      - "8090:8080"

volumes:
  pgdata:
